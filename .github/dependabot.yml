# Dependabot config. npm (root pnpm-lock.yaml) + github-actions, weekly.
# Grouping mirrors the auto-merge policy: low-risk minor/patch bumps are grouped
# so they can be merged in bulk, while majors open as individual PRs for review.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # pnpm 11 verifies the lockfile against a supply-chain minimum-release-age
    # policy, so a bump proposed the moment a version lands cannot install
    # (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION) and the PR sits red until the
    # package ages out. Cooldown holds the PR back until the version is old
    # enough to pass, which removes the red-PR churn without delaying anything
    # that could have merged sooner anyway.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
