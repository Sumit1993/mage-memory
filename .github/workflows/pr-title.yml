# Enforce that PR titles follow Conventional Commits. The repo squash-merges, so a
# PR's title becomes the commit subject on main — which is exactly what release-please
# parses to decide the version bump and changelog. A non-conventional title would be
# silently ignored by release-please (no bump, no changelog entry), so we gate it here.
#
# This validates the PR TITLE, not local branch commits (those get squashed away) —
# which is why a commit-msg hook (husky/commitlint) would be the wrong layer for a
# branch-protected, squash-merge repo.
#
# Make this a REQUIRED status check in branch protection (Settings -> Branches) so a
# non-conventional title blocks merge. `synchronize` is included because a required
# check must run on each new push to stay green.
name: Lint PR title

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize
  # Merge-queue support (#403). A required check must report on the queue's
  # speculative merge commit or the queue can never merge anything. There is no
  # PR title to validate in a `merge_group` event — the title was already
  # validated (and is immutable to the queue) on the pull_request_target events
  # above, and a PR with a red title check cannot enter the queue in the first
  # place — so the queue leg passes by construction rather than re-checking.
  merge_group:

permissions:
  pull-requests: read

jobs:
  # ONE job, with the event condition at STEP level. Not two same-named jobs
  # with job-level `if`s: that publishes two check runs under the required
  # context name (one real, one skipped), and which of them branch protection
  # resolves the context against is undefined — a skipped run could shadow a
  # genuine lint failure. A step-level skip leaves this single job (and its
  # single check run) green, so exactly one check run per event carries the
  # required name. Caught by the review lane on the PR that introduced the
  # two-job split.
  validate:
    name: Validate PR title (conventional commits)
    runs-on: ubuntu-latest
    steps:
      # validation logic lives in canon; the job/check name must stay stable.
      - uses: prismalens/gh-workflows/actions/pr-title@main
