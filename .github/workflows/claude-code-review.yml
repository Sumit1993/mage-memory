name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# This is a managed caller stub.
# The lane logic lives in prismalens/gh-workflows/.github/workflows/claude-code-review.yml.
# Do not add logic here.

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Caller-side draft guard: skip before the reusable workflow is even invoked
    # (the callee carries a backstop guard; GitHub cannot filter drafts at the trigger).
    if: github.event.pull_request.draft != true
    uses: prismalens/gh-workflows/.github/workflows/claude-code-review.yml@main
    # inherit does not cross ownership boundaries (this repo -> prismalens org);
    # the callee's required secret must be mapped explicitly.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: read
      # write is the ceiling for the callee's `announce` liveness job;
      # the callee's `review` job self-restricts to read.
      pull-requests: write
      issues: read
      id-token: write
