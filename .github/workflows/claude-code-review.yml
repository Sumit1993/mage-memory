# Generated by the `claude` CLI's GitHub Actions setup, then adjusted for this
# repo. Tracked in #301.
#
# THIS LANE IS ADVISORY, AND THAT IS NOW THE DESIGN (#415)
# -------------------------------------------------------
# It publishes no commit status and gates nothing. The `review-evidence` required
# check it used to feed is retired, along with its `marker` job. That gate tried to
# manufacture "a competent reviewer read this exact code" out of vendor artifacts —
# comment bodies, review states, marker strings — none of which is a documented API
# contract and all of which are summonable by anyone who can comment. Five sound
# fixes produced five holes in the same place, and the intended happy path never
# once completed end to end: the `marker` job posted with `GITHUB_TOKEN`, and
# GitHub's anti-recursion rule stops a `GITHUB_TOKEN` comment from firing the
# `issue_comment` trigger the publisher listened on.
#
# WHAT ENFORCES A MERGE NOW: `CI gate`, `Validate PR title (conventional commits)`,
# and GitHub's native `required_review_thread_resolution`. This reviewer's INLINE
# FINDINGS open threads, and unresolved threads block merge natively. Findings
# block; silence does not. A sensitive path gets a second, independent opinion by
# applying the `review-ready` label, which admits an online CodeRabbit review
# through `.coderabbit.yaml`'s `auto_review.labels` valve — a human decision now,
# not an automated path match.
#
# WHY `synchronize` IS KEPT
# -------------------------
# It costs a review on every push, and `strict_required_status_checks_policy` is
# on, so every merge to `main` forces the next PR to update and pushes again.
# It stays anyway: a review of an earlier commit says nothing about the code that
# will actually land, and a thread opened against a line the branch has since
# rewritten is a stale objection someone has to hand-resolve. The concurrency group
# below is the cheaper half of that trade — it collapses a burst of pushes into one
# review instead of reviewing each.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review in flight per PR. `cancel-in-progress` is correct here: a review of a
# superseded SHA has no value once a newer commit exists, and its threads would
# land on lines that may no longer exist.
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no repository secrets, so CLAUDE_CODE_OAUTH_TOKEN would be
    # empty and this job would fail — a red job on every outside contribution,
    # which reads as "the contributor broke something". Skip cleanly instead.
    #
    # Fork PRs take the CodeRabbit lane (`review-ready`, or `@coderabbitai review`
    # by hand). `pull_request_target` is deliberately NOT used to work around this:
    # it pairs repository secrets with an attacker-controlled ref, which is the
    # exact combination this repo removed with cla.yml.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # READ-ONLY, and it stays read-only. The action posts under its own app
    # installation token, not this one, so the review still publishes; what this
    # token cannot do is write a commit status or author a comment. This workflow
    # runs a model over attacker-influencable diff text — it must never hold a
    # write it could be talked into using.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    # Consumed by the `announce` job below: comments created at or after this
    # instant are this run's output, anything earlier is a previous run's.
    outputs:
      started_at: ${{ steps.clock.outputs.started_at }}

    steps:
      - name: Record review start time
        id: clock
        run: echo "started_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # The agent runs in this workspace. Left on, checkout leaves a usable
          # credential in .git/config for the whole job.
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        # SYNCHRONOUS SUBAGENTS, PINNED BY BEHAVIOR — THE ASYNC REGRESSION
        # (#403, root-caused 2026-08-12).
        #
        # Recent Claude Code CLIs launch Task/Agent subagents in the BACKGROUND
        # by default (documented default since 2.1.198): the tool result is
        # "Async agent launched successfully... you will be notified when it
        # completes", and that notification arrives on a LATER turn. The action
        # runs the CLI in one-shot print mode, where ending the turn ends the
        # process — so a reviewer that launches the plugin's step-1 eligibility
        # subagent and yields to wait exits `success` having reviewed nothing.
        # Observed end-to-end in run 31570506278 (full transcript in that log,
        # courtesy of `show_full_output` below): the last assistant message is
        # "I'll continue once that comes back", and nothing ever came back to a
        # process that had already exited. Every review from 2026-08-11 onward
        # (CLI 2.1.227/228) posted nothing; the 2026-08-10 runs (2.1.226)
        # posted normally.
        #
        # CLAUDE_CODE_DISABLE_BACKGROUND_TASKS=1 (code.claude.com/docs/en/
        # env-vars) disables all background-task machinery, including the
        # `run_in_background` parameter on subagent tools — every subagent
        # blocks and returns its result inline, which is the only shape that
        # can work in print mode. Verified on 2.1.228 before adopting. The CLI
        # itself stays unpinned and tracks latest; step-level `env` reaches the
        # CLI because the action spawns it as a child process.
        #
        # REMOVE once upstream makes print mode survive the launch→notification
        # gap (the 2.1.228 changelog's self-hosted-runner fix is the same bug
        # class, so it is on their radar). Then VERIFY on a real PR that a
        # review actually posts — a green job proves nothing; read the liveness
        # comment the `announce` job leaves on the PR.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The transcript is the only place a silent run is diagnosable. The
          # 2026-08-11 failure on #418 — 34 turns, 30 permission denials, nothing
          # posted, green job — was undiagnosable from the default log, which
          # prints init and result and hides every message in between (a debug
          # rerun does not reveal them either). This repo is public: the diff,
          # the PR, and the findings are already public, so the transcript adds
          # no exposure the PR itself doesn't have.
          show_full_output: true
          # ` --comment` ON THE NEXT LINE IS THE SINGLE LOAD-BEARING ELEMENT OF THE
          # WHOLE REVIEW ARRANGEMENT. Do not remove it, and do not "simplify" the
          # prompt past it.
          #
          # The plugin's step 7 no-ops its ENTIRE posting path when `--comment` is
          # absent ("if --comment was NOT provided, stop here"), so without it the
          # reviewer runs a full review and publishes none of it. Folded in from
          # #410, which is where that was diagnosed.
          #
          # Since #415 there is no gate underneath to catch that: enforcement is
          # GitHub's `required_review_thread_resolution`, which has nothing to
          # resolve if the reviewer never opens a thread. A missing `--comment`
          # therefore does not fail anything — it silently converts every PR into
          # an unreviewed one. The `Report reviewer liveness` step below is the only
          # thing that will say so, and it says it in a log, not in a red check.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # THE TOOL LIST IS LOAD-BEARING FOR THE SAME REASON. Supplying `prompt:`
          # puts the action in AGENT mode, and in agent mode
          # `src/modes/agent/index.ts` resolves the tool list ONLY from
          # `claude_args` — `settings` is not read for this. Worse,
          # `src/mcp/install-mcp-server.ts` installs the action's own MCP posting
          # servers CONDITIONALLY on that list: no `mcp__github_comment__` entry, no
          # comment server; no `mcp__github_inline_comment__` entry, no inline
          # server. So an omitted or partial list does not merely restrict the
          # reviewer — it leaves it with nothing to post with.
          #
          # Both failure shapes were observed on 2026-08-09. A single-entry list:
          # 11 turns, 1 permission denial, nothing posted, `conclusion: success`.
          # No list at all (grant attempted via `settings`): 37 turns, 15 denials,
          # nothing posted, `conclusion: success`. Tag mode works out of the box
          # only because it builds its own list; agent mode has no default.
          #
          # THE LIST IS THE PLUGIN'S OWN DECLARATION, PLUS `Task`.
          #
          # `plugins/code-review/commands/code-review.md` in anthropics/claude-code
          # declares `allowed-tools:` in its frontmatter — but agent mode does not
          # merge it, so it has to be restated here. Copy it from there when the
          # plugin changes, not from `tagModeTools`, which is a different lane's
          # list and does not include what a review needs.
          #
          # `Task` is the entry that is easy to miss and fatal to omit: that
          # command is SUBAGENT-BASED. Its first step launches a haiku agent, then
          # a sonnet agent to summarise, then four agents in parallel to review.
          # Without `Task` the reviewer is denied at its first step and gives up —
          # observed on #401 at `6dcb987f`: 4 turns, 1 permission denial, $0.17,
          # nothing posted, `conclusion: success`.
          #
          # `Bash(gh pr review:*)` is deliberately ABSENT: a formal blocking verdict
          # is a second blocker with dismissal friction on top of thread
          # resolution. Inline findings are how this lane objects.
          #
          # A stale list fails SILENTLY — an agent denied at its first step still
          # exits `success`. Re-derive this list whenever the plugin changes; a
          # green job is not proof the list is current. Read the review job log
          # (denials are printed there) when a PR comes back with no threads.
          claude_args: >-
            --allowed-tools
            "Task,Read,Grep,Glob,LS,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment"

      # LIVENESS, ANNOUNCED — NOT ENFORCED.
      #
      # `claude-code-action` sets `conclusion` in `src/entrypoints/run.ts` only
      # after the agent has actually executed. On the workflow-validation skip path
      # (this file differs from the copy on the default branch, which the action
      # refuses to run against) it returns early having set only
      # `skipped_due_to_workflow_validation_mismatch`, which the composite action
      # does not expose — so `conclusion` arrives EMPTY and the step exits 0. Job
      # success therefore does not mean the reviewer looked.
      #
      # This step exists so that fact appears in the log instead of nowhere. It
      # does not fail the job: nothing here is a required check, and a PR that
      # edits this file can never be reviewed by this lane (the validation is a
      # control — without it a PR could rewrite the reviewing workflow and have its
      # own version run with the app token). Label such a PR `review-ready` if it
      # deserves an independent read.
      - name: Report reviewer liveness
        if: always() && steps.claude-review.outputs.conclusion != 'success'
        env:
          CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "$CONCLUSION" ]; then
            echo "::warning::claude-code-action reported no conclusion at ${HEAD_SHA:0:8}, so the reviewer never ran." \
                 "The usual cause is that this PR edits .github/workflows/claude-code-review.yml, which the action" \
                 "always self-skips on; otherwise read this job's log for permission denials." \
                 "This PR has NOT been machine-reviewed — apply review-ready if it needs an independent read."
          else
            echo "::warning::The reviewer ran at ${HEAD_SHA:0:8} and concluded '$CONCLUSION', not success." \
                 "A stale --allowed-tools list is the usual cause — see the comment on that input."
          fi

  # LIVENESS, ON THE PR — STILL NOT ENFORCED.
  #
  # The log-only warning above proved invisible in practice: on 2026-08-11 the
  # reviewer ran a full 34-turn review of #418, posted nothing, and the job
  # stayed green — nobody saw a thing until the operator went digging days
  # later. This job puts the same fact where the operator already looks, the PR
  # timeline: one comment per PR, updated in place per run, saying whether
  # claude[bot] actually published anything for the head that was reviewed.
  #
  # Three properties are load-bearing:
  #   - ADVISORY ONLY. Nothing gates on this comment (#415 retired that whole
  #     idea); it exists so silence stops looking like approval.
  #   - A SEPARATE JOB, not a step. The review job's token must stay read-only
  #     because the agent executes inside that job; this job runs no agent, so
  #     it can hold the one `pull-requests: write` safely.
  #   - GITHUB_TOKEN AUTHORSHIP. Comments created with the workflow token do
  #     not fire `issue_comment` triggers (GitHub's anti-recursion rule — the
  #     same rule that killed #301's marker chain, working FOR us this time),
  #     so this comment can never summon the @claude mention lane or loop.
  announce:
    name: Announce reviewer liveness
    needs: review
    # Skipped fork PRs post nothing: the review lane never looked, and the
    # fork lane's story (CodeRabbit via `review-ready`) is documented above.
    if: always() && needs.review.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Upsert liveness comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_RESULT: ${{ needs.review.result }}
          STARTED_AT: ${{ needs.review.outputs.started_at }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          short=${HEAD_SHA:0:8}
          # If review died before its clock step, STARTED_AT is empty and the
          # `>=` filter below would count every claude[bot] comment ever made.
          # An impossible timestamp keeps the count honest (zero).
          [ -n "$STARTED_AT" ] || STARTED_AT="9999-01-01T00:00:00Z"

          # Inline review comments claude[bot] left against the reviewed head —
          # strictly this head. No `original_commit_id` fallback: a comment that
          # only matches after GitHub rewrote it for a newer push is a previous
          # head's comment, and counting it would report stale work as this
          # run's.
          inline=$(gh api "repos/$REPO/pulls/$PR/comments" --paginate --jq \
            "[.[] | select(.user.login==\"claude[bot]\")
                  | select(.commit_id==\"$HEAD_SHA\")] | length")

          # Summary comments (the plugin's no-issues path posts one). Three
          # filters, each necessary: author, because only claude[bot] posts
          # them; created >= run start, because issue comments carry no SHA;
          # and the plugin's fixed '## Code review' heading, because the
          # @claude MENTION lane shares the claude[bot] identity and a mention
          # reply landing mid-review must not be counted as review output.
          # This stays an advisory display, not evidence (#415): it reports
          # what was posted, it does not certify who read what.
          summary=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq \
            "[.[] | select(.user.login==\"claude[bot]\")
                  | select(.created_at >= \"$STARTED_AT\")
                  | select(.body | startswith(\"## Code review\"))] | length")

          if [ "$((inline + summary))" -gt 0 ]; then
            verdict="reviewed \`$short\` and posted ${inline} inline / ${summary} summary comment(s)."
          else
            verdict="finished on \`$short\` (job result: ${REVIEW_RESULT}) but posted **nothing**. \
          Silence is not approval: this head has no machine review on record. \
          Read the [run log]($RUN_URL) (full transcript is enabled) and consider the \`review-ready\` label."
          fi

          marker='<!-- claude-review-liveness -->'
          body="$marker
          **Claude review lane** — [run]($RUN_URL): $verdict"

          # Only this workflow's own comment qualifies for the upsert: without
          # the author filter, any participant could pre-create a marker
          # comment and this job would PATCH — and thereby keep republishing
          # into — a comment it does not own.
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq \
            "[.[] | select(.user.login==\"github-actions[bot]\")
                  | select(.body | startswith(\"$marker\"))][0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          fi
          echo "liveness: $verdict"
