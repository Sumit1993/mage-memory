# Generated by the `claude` CLI's GitHub Actions setup. Responds to `@claude`
# mentions on issues, PRs and reviews. Tracked in #301.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Serialise per thread so two `@claude` mentions in quick succession cannot run
# against each other. NOT `cancel-in-progress`: unlike a diff review, a mention is
# an instruction someone typed, and killing it half-done loses work nobody asked
# to discard.
concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # TWO conditions, and both matter.
    #
    # The mention itself is the second half. The first half is WHO may mention:
    # this is a public repo, so without the association filter any account that
    # can leave a comment can start a run that spends the subscription and feeds
    # attacker-chosen text to an agent holding this repo's app identity.
    #
    # Since #415 there is no merge gate reading anything this lane could produce —
    # `review-evidence` is retired and merges are enforced by `CI gate`, the title
    # check, and GitHub's native unresolved-thread rule. So this filter is no longer
    # backed by a second control underneath it: it is the whole of what stops an
    # arbitrary commenter from spending the subscription and steering an agent that
    # carries this repo's app identity. Note the limit of any association check —
    # the adversary this repo models is a drifted agent holding a maintainer
    # credential, and such an agent passes every one of them. What contains that is
    # the token scope on this job and the `--disallowed-tools` list below, not this
    # condition.
    if: |
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR' ||
        github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR'
      ) && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # The agent runs in this workspace. Left on, checkout leaves a usable
          # credential in .git/config for the whole job.
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # This lane must never be able to SUBMIT a pull request review.
          #
          # It shares the `claude[bot]` identity with claude-code-review.yml. A
          # mention is attacker-influenced text by construction, so a mention lane
          # that can submit reviews is a mention lane that can be talked into
          # APPROVING — or, worse under the current arrangement, into RESOLVING the
          # threads that are now the only thing blocking a merge. It never needed
          # the capability: answering a mention is commenting, not reviewing.
          #
          # This is no longer defence in depth. Since #415 removed the
          # `review-evidence` publisher there is no run-binding underneath to catch
          # a misconfiguration here, so this list is load-bearing on its own.
          claude_args: >-
            --disallowed-tools "Bash(gh pr review:*)"
            --disallowed-tools "Bash(gh api:*pulls/*/reviews*)"

