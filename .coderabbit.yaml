reviews:
  profile: chill
  # Rate-limit discipline. This repo is on CodeRabbit's OSS tier: 1-10 PR reviews per
  # developer per hour, scaling with project popularity — a young repo sits near the
  # bottom. EVERY review run spends one, including the automatic incremental review
  # after each push, so a fix-push loop drains the whole budget on a single PR.
  # Pausing after 1 reviewed commit means one review per PR; push your fixes as a batch,
  # then re-request explicitly with an `@coderabbitai review` comment.
  auto_review:
    # CLI-FIRST LANE. Online review is opt-in, not automatic.
    #
    # The rate limit is per DEVELOPER, not per repo — all three repos draw one
    # counter. Measured over 180 merged PRs: 7.5/day, worst hour 8 opens, and at
    # 1 review/hr 61% of PRs arrived with the counter already empty. Reviewing
    # everything automatically means the reviews land where they happen to fall,
    # not where they are worth spending.
    #
    # So: the CodeRabbit CLI (a separate, larger counter) reviews every push via
    # the kit's pre-push gate, and this scarce online counter is no longer spent
    # automatically — only on PRs explicitly labelled `review-ready`.
    #
    # SCOPE, precisely: `labels` gates AUTOMATIC review only. Manual triggers —
    # `@coderabbitai review` and `@coderabbitai full review` — run regardless of
    # these settings and still spend the online counter, on a labelled PR or not.
    # That is deliberate and wanted: it is the escape hatch for re-requesting a
    # review after `auto_pause_after_reviewed_commits` stops incremental ones.
    # But it means this is a DEFAULT, not a hard cap. The cap is discipline, plus
    # the fact that a manual trigger is an explicit act rather than a side effect
    # of opening a PR — which is exactly the 61%-empty-counter problem above.
    #
    # This is NOT a reduction in review. `review-evidence` is a required check
    # (ruleset 17441632): a PR with neither a CodeRabbit review nor a CLI review
    # marker at its head SHA cannot merge. Removing automatic review without that
    # gate in place would have made "unreviewed" the silent default — which is why
    # the gate shipped first (prismalens/prismalens#301).
    #
    # No dry run exists for this setting: CodeRabbit applies base-branch config
    # only for open-source repos, so it takes effect the moment it lands on main.
    # The revert is one commit — see ci/cli-first-valve-REVERT.
    enabled: false
    labels:
      - "review-ready"
    auto_pause_after_reviewed_commits: 1
    ignore_title_keywords:
      - "WIP"
  # Not a rate-limit lever (the limit counts reviews, not files) — this keeps PRs under
  # the OSS files-per-review cap of 50-150. docs/src/generated/mage-data.json is
  # deliberately NOT excluded: path_instructions require it to be regenerated in-PR.
  path_filters:
    - "!pnpm-lock.yaml"
  path_instructions:
    - path: "src/**"
      instructions: |
        If this PR changes a CLI verb, flag, help string, generated skill content, hook behavior, file layout, or operator workflow, it must also update the documentation surface that describes that behavior — an unrelated docs/ or README change does not satisfy this. If the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface (docs/src/content/docs/reference/commands.mdx, the loop/ pages, CONVENTIONS.md §10 command tiers, skills/*/SKILL.md descriptions, package.json description). If a command registration in src/cli-program.ts changes, docs/src/generated/mage-data.json must be regenerated in the same PR.
        
        Repo invariants to enforce:
        - Capture insight/procedure/pointers, never copies of sources (ADR-0004).
        - No runtime of our own: automation rides the host agent's hooks (ADR-0009). Flag anything adding daemons/watchers/servers.
        - `mage dream --apply` is the SINGLE writer that mints skills/applies proposals; no other code path may write generated skills (ADR-0030, ADR-0038).
        - Deterministic code never decides what a lesson is — it narrows, the agent judges (ADR-0029, ADR-0038). Flag new deterministic keep/discard classifiers of semantic content.
        - Two-gate redaction: secrets stripped before write (ADR-0014). Flag new write paths for observed/captured content that bypass redaction.
        - Command-tier discipline (CONVENTIONS.md §10): new commands must be explicitly visible (human verb) or `{ hidden: true }` (plumbing), and CONVENTIONS.md §10 updated.

        When a PR adds or substantially rewrites documentation that explains a resolution order, a mode/topology, a state machine, a pipeline, a precedence rule, or a side-by-side comparison — anything with three or more interacting parts — flag it as a documentation gap if the passage is prose-only. Such a passage must carry a worked example (real or realistically simulated input mapped to its output), a terminal transcript, a diagram (inline SVG or fenced diagram source — never a new build dependency added just to render one), or, only when the subject is genuinely graphical, a screenshot that names what invalidates it. Name the specific passage and which form fits; "add a diagram" is not an actionable finding. Do not flag prose that is below this threshold — a visual restating a two-step sequence is noise.
    - path: "skills/**"
      instructions: |
        If this PR changes a CLI verb, flag, help string, generated skill content, hook behavior, file layout, or operator workflow, it must also update the documentation surface that describes that behavior — an unrelated docs/ or README change does not satisfy this. If the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface (docs/src/content/docs/reference/commands.mdx, the loop/ pages, CONVENTIONS.md §10 command tiers, skills/*/SKILL.md descriptions, package.json description).
        
        Repo invariants to enforce:
        - Capture insight/procedure/pointers, never copies of sources (ADR-0004).

        When a PR adds or substantially rewrites documentation that explains a resolution order, a mode/topology, a state machine, a pipeline, a precedence rule, or a side-by-side comparison — anything with three or more interacting parts — flag it as a documentation gap if the passage is prose-only. Such a passage must carry a worked example (real or realistically simulated input mapped to its output), a terminal transcript, a diagram (inline SVG or fenced diagram source — never a new build dependency added just to render one), or, only when the subject is genuinely graphical, a screenshot that names what invalidates it. Name the specific passage and which form fits; "add a diagram" is not an actionable finding. Do not flag prose that is below this threshold — a visual restating a two-step sequence is noise.
    - path: "scripts/**"
      instructions: |
        If this PR changes a CLI verb, flag, help string, generated skill content, hook behavior, file layout, or operator workflow, it must also update the documentation surface that describes that behavior — an unrelated docs/ or README change does not satisfy this. If the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface (docs/src/content/docs/reference/commands.mdx, the loop/ pages, CONVENTIONS.md §10 command tiers, skills/*/SKILL.md descriptions, package.json description).

